name: Manual Build Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - macos
        - windows
        - linux

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
      fail-fast: false
    
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Sharp (for icon processing)
      run: npm install sharp
      
    - name: Build application
      run: npm run build
      
    - name: Create app icons (macOS)
      if: matrix.platform == 'macos'
      run: |
        mkdir -p build/icons
        mkdir -p icon.iconset
        cp "assets/images/preamble logo.png" icon.iconset/icon_512x512.png
        sips -z 16 16 icon.iconset/icon_512x512.png --out icon.iconset/icon_16x16.png
        sips -z 32 32 icon.iconset/icon_512x512.png --out icon.iconset/icon_32x32.png
        sips -z 128 128 icon.iconset/icon_512x512.png --out icon.iconset/icon_128x128.png
        sips -z 256 256 icon.iconset/icon_512x512.png --out icon.iconset/icon_256x256.png
        iconutil -c icns icon.iconset
        mv icon.icns build/icons/icon.icns
        
    - name: Create app icons (Windows/Linux)
      if: matrix.platform != 'macos'
      run: |
        mkdir -p build/icons
        node -e "
          const sharp = require('sharp');
          sharp('assets/images/preamble logo.png')
            .resize(256, 256)
            .png()
            .toFile('build/icons/icon-256.png');
        "
        
    - name: Build for macOS
      if: matrix.platform == 'macos'
      run: npm run dist:mac
        
    - name: Build for Windows
      if: matrix.platform == 'windows'
      run: npm run dist:win
        
    - name: Build for Linux
      if: matrix.platform == 'linux'
      run: npm run dist:linux
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-installers
        path: dist/*
        retention-days: 5 