name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev libdrm2-dev libxcomposite-dev libxdamage-dev libxrandr-dev libgbm-dev libxss-dev libasound2-dev
        
    - name: Install dependencies with retry
      run: |
        # Try normal install first
        npm ci --legacy-peer-deps || {
          echo "First install failed, trying with force..."
          npm ci --force --legacy-peer-deps || {
            echo "Second install failed, trying without optional deps..."
            npm ci --no-optional --legacy-peer-deps || {
              echo "Third install failed, trying with ignore-scripts..."
              npm ci --ignore-scripts --legacy-peer-deps
            }
          }
        }
      
    - name: Build application
      run: npm run build
      
    - name: Build installers
      run: npm run dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifacts to release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: |
          dist-electron/*.dmg
          dist-electron/*.exe
          dist-electron/*.AppImage
          dist-electron/*.deb
          dist-electron/*.zip
          dist-electron/*.msi
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifacts (manual trigger)
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch'
      with:
        name: installers-${{ matrix.os }}
        path: |
          dist-electron/*.dmg
          dist-electron/*.exe
          dist-electron/*.AppImage
          dist-electron/*.deb
          dist-electron/*.zip
          dist-electron/*.msi
        retention-days: 7 