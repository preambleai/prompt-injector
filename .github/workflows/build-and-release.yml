name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Sharp (for icon processing)
      run: npm install sharp
      
    - name: Build application
      run: npm run build
      
    - name: Create app icons (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Create icon for macOS
        mkdir -p assets
        # Convert PNG to ICNS using built-in tools
        mkdir -p icon.iconset
        if [ -f "assets/images/preamble logo.png" ]; then
          cp "assets/images/preamble logo.png" icon.iconset/icon_512x512.png
        else
          cp "assets/icon-512.png" icon.iconset/icon_512x512.png
        fi
        sips -z 16 16 icon.iconset/icon_512x512.png --out icon.iconset/icon_16x16.png
        sips -z 32 32 icon.iconset/icon_512x512.png --out icon.iconset/icon_32x32.png
        sips -z 128 128 icon.iconset/icon_512x512.png --out icon.iconset/icon_128x128.png
        sips -z 256 256 icon.iconset/icon_512x512.png --out icon.iconset/icon_256x256.png
        iconutil -c icns icon.iconset
        mv icon.icns assets/icon.icns
        
    - name: Create app icons (Windows/Linux)
      if: matrix.os != 'macos-latest'
      run: |
        # Create icon for Windows/Linux
        mkdir -p assets
        node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          let inputFile = 'assets/images/preamble logo.png';
          if (!fs.existsSync(inputFile)) {
            inputFile = 'assets/icon-512.png';
          }
          sharp(inputFile)
            .resize(256, 256)
            .png()
            .toFile('assets/icon-256.png');
        "
        
    - name: Build for macOS
      if: matrix.os == 'macos-latest'
      run: npm run dist:mac
        
    - name: Build for Windows
      if: matrix.os == 'windows-latest'
      run: npm run dist:win
        
    - name: Build for Linux
      if: matrix.os == 'ubuntu-latest'
      run: npm run dist:linux
        
    - name: List build artifacts
      run: |
        echo "=== Build artifacts ==="
        find dist-electron -type f -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" -o -name "*.msi" 2>/dev/null | sort || echo "No artifacts found"
        
    - name: Upload macOS artifacts
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macos-installers
        path: |
          dist-electron/*.dmg
          dist-electron/*.zip
        retention-days: 5
        
    - name: Upload Windows artifacts
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-installers
        path: |
          dist-electron/*.exe
          dist-electron/*.msi
        retention-days: 5
        
    - name: Upload Linux artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: linux-installers
        path: |
          dist-electron/*.AppImage
          dist-electron/*.deb
        retention-days: 5
        
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: List downloaded files
      run: |
        echo "=== Downloaded artifacts ==="
        find . -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" -o -name "*.msi" | sort
        
    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          macos-installers/*
          windows-installers/*
          linux-installers/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 