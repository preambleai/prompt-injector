name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        # Install with better error handling
        npm ci --prefer-offline --no-audit || {
          echo "First install failed, trying with legacy peer deps..."
          npm ci --legacy-peer-deps --prefer-offline --no-audit || {
            echo "Second install failed, trying without optional deps..."
            npm ci --no-optional --legacy-peer-deps --prefer-offline --no-audit || {
              echo "Third install failed, trying with ignore-scripts..."
              npm ci --ignore-scripts --legacy-peer-deps --prefer-offline --no-audit
            }
          }
        }
      
    - name: Build application
      run: npm run build
      
    - name: Build installers
      run: npm run dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifacts to release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: |
          dist-electron/*.dmg
          dist-electron/*.exe
          dist-electron/*.zip
          dist-electron/*.msi
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifacts (manual trigger)
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch'
      with:
        name: installers-${{ matrix.os }}
        path: |
          dist-electron/*.dmg
          dist-electron/*.exe
          dist-electron/*.zip
          dist-electron/*.msi
        retention-days: 7 